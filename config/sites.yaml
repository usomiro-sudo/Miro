# Configuração dos sites monitorados.
#
# comparacao: concorrentes de porte parecido, comparados produto a produto
#   (URLs individuais ficam em config/products.yaml)
#
# referencia: marcas grandes, só para acompanhar tendência de preço e
#   lançamentos de corrida masculina. Aqui apontamos para páginas de
#   LISTAGEM (categoria "corrida masculina"), não produto a produto.
#   Preencha "listagem_url" com a URL da categoria depois de navegar no site.

comparacao:
  seekdopa:
    nome: "Seekdopa"
    base_url: "https://seekdopa.com"
  woom:
    nome: "Woom"
    base_url: "https://www.woom.com.br"
  vorr:
    nome: "Vorr"
    base_url: "https://www.vorr.com.br"

referencia:
  nike:
    nome: "Nike"
    base_url: "https://www.nike.com.br"
    listagem_url: ""   # ex: categoria de corrida masculina
  adidas:
    nome: "Adidas"
    base_url: "https://www.adidas.com.br"
    listagem_url: ""   # ex: categoria de corrida masculina

# Configurações de coleta (mantenha educado com os sites dos concorrentes)
request:
  user_agent: "MIRO-Intelligence/1.0 (+contato: uso.miro@outlook.com; monitoramento de preco publico)"
  timeout_seconds: 15
  delay_seconds_between_requests: 3
