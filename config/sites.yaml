# Configuração dos concorrentes monitorados.
#
# Não é comparação de preço produto a produto: para cada concorrente
# apontamos a HOME PAGE ("home_url") e o dashboard sinaliza tendências
# encontradas nela — promoções/banners e novos lançamentos em destaque.

concorrentes:
  seekdopa:
    nome: "Seekdopa"
    home_url: "https://seekdopa.com"
  woom:
    nome: "Woom"
    home_url: "https://www.woom.com.br"
  vorr:
    nome: "Vorr"
    home_url: "https://www.vorr.com.br"
  nike:
    nome: "Nike"
    home_url: "https://www.nike.com.br"
  adidas:
    nome: "Adidas"
    home_url: "https://www.adidas.com.br"

# Palavras-chave usadas para classificar trechos de texto da home page.
# Ajuste livremente sem precisar mexer em código (comparação é feita em
# minúsculas, sem considerar acentuação da página).
deteccao:
  promocoes:
    - "% off"
    - "%off"
    - "desconto"
    - "cupom"
    - "frete grátis"
    - "frete gratis"
    - "black friday"
    - "liquidação"
    - "liquidacao"
    - "queima de estoque"
    - "promoção"
    - "promocao"
    - "sale"
  lancamentos:
    - "lançamento"
    - "lancamento"
    - "novo"
    - "nova coleção"
    - "nova colecao"
    - "chegou"
    - "recém-chegado"
    - "recem-chegado"
    - "new arrival"
    - "just in"
    - "new drop"

# Fonte para a aba "Provas de corrida" — só entram provas que oferecem
# meia maratona (21km) e/ou maratona (42km); outras distâncias são ignoradas.
provas:
  fonte:
    nome: "Corridinhas"
    url: "https://www.corridinhas.com.br/races"
  janela_meses: 12

# Configurações de coleta (mantenha educado com os sites dos concorrentes)
request:
  user_agent: "MIRO-Intelligence/1.0 (+contato: uso.miro@outlook.com; monitoramento publico de home pages)"
  timeout_seconds: 15
  delay_seconds_between_requests: 3
